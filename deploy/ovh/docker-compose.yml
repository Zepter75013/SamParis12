# Déploiement autonome (VPS OVH ou tout serveur Docker) : MySQL + API Go + frontend nginx,
# et en option Caddy pour le HTTPS automatique (profil "caddy").
#
#   cp .env.example .env   # puis remplir
#   docker compose up -d --build                     # derrière un reverse-proxy existant (port 127.0.0.1:8094)
#   docker compose --profile caddy up -d --build     # avec Caddy (ports 80/443 libres requis)
services:
  mysql:
    image: mysql:8.0
    container_name: samparis12-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${SAMPARIS12_DB_NAME:-samparis12db}
      MYSQL_USER: ${SAMPARIS12_DB_USER:-SamParis12Admin}
      MYSQL_PASSWORD: ${SAMPARIS12_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # Au tout premier démarrage (base vide), MySQL exécute ces fichiers dans l'ordre : schéma + contenu de démo.
      # Pour restaurer un dump de la base du NAS à la place, commenter cette ligne (voir README.md).
      - ../../backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: samparis12-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${SAMPARIS12_DB_NAME:-samparis12db}
      DB_USER: ${SAMPARIS12_DB_USER:-SamParis12Admin}
      DB_PASSWORD: ${SAMPARIS12_DB_PASSWORD}
      APP_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    volumes:
      - ./data/member-photos:/app/uploads/photos
      - ./data/club-documents:/app/uploads/documents

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: samparis12-frontend
    restart: always
    depends_on:
      - backend
    # Joignable uniquement depuis la machine (reverse-proxy existant) ; Caddy passe, lui, par le réseau Docker.
    ports:
      - "127.0.0.1:8094:80"

  caddy:
    image: caddy:2
    container_name: samparis12-caddy
    profiles: ["caddy"]
    restart: always
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
