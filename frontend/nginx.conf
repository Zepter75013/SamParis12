server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Envois de photos, vidéos et documents dans la messagerie (jusqu'à 300 Mo par message).
    client_max_body_size 300m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le frontend est buildé avec VITE_API_BASE_URL=/api : le navigateur
    # appelle toujours la même origine que la page, et nginx renvoie la
    # requête vers le backend en interne (pas de CORS cross-origin côté
    # navigateur, pas besoin d'exposer le backend publiquement).
    # Messagerie : flux d'événements en temps réel (SSE) — pas de mise en tampon, connexion longue durée.
    location = /api/chat/stream {
        proxy_pass http://samparis12-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        # Pas de chemin après le port : nginx transmet l'URI d'origine telle
        # quelle (/api/news reste /api/news), qui est ce que le routeur Go
        # attend (ses routes sont enregistrées avec le préfixe /api/...).
        proxy_pass http://samparis12-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Photos de trombinoscope, servies par le backend (même raison : pas de
    # chemin après le port, l'URI /uploads/photos/... est transmise telle quelle).
    location /uploads/ {
        proxy_pass http://samparis12-backend:8080;
        proxy_set_header Host $host;
    }
}
