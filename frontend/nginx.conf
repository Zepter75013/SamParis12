server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le frontend est buildé avec VITE_API_BASE_URL=/api : le navigateur
    # appelle toujours la même origine que la page, et nginx renvoie la
    # requête vers le backend en interne (pas de CORS cross-origin côté
    # navigateur, pas besoin d'exposer le backend publiquement).
    location /api/ {
        # Pas de chemin après le port : nginx transmet l'URI d'origine telle
        # quelle (/api/news reste /api/news), qui est ce que le routeur Go
        # attend (ses routes sont enregistrées avec le préfixe /api/...).
        proxy_pass http://samparis12-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
