services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samparis12-backend
    restart: always
    environment:
      DB_HOST: bdd-mysql
      DB_PORT: 3306
      DB_NAME: ${SAMPARIS12_DB_NAME}
      DB_USER: ${SAMPARIS12_DB_USER}
      DB_PASSWORD: ${SAMPARIS12_DB_PASSWORD}
      APP_PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-contact@samparis12.org}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    # Accès direct optionnel (debug/API) — à retirer si un reverse-proxy
    # externe se charge de tout exposer.
    ports:
      - "8093:8080"
    volumes:
      - ./member-photos:/app/uploads/photos
      - ./club-documents:/app/uploads/documents
      - ./chat-files:/app/uploads/chat
    networks:
      - disques-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: samparis12-frontend
    restart: always
    ports:
      - "8094:80"
    depends_on:
      - backend
    networks:
      disques-network:
        aliases:
          - samparis12-frontend

networks:
  disques-network:
    external: true
    name: disques-manager_disques-network
