# Environnement de développement local : base MySQL dédiée (contrairement à
# la prod qui partage le conteneur "bdd-mysql" du NAS), migrations et
# contenu d'exemple appliqués automatiquement au premier démarrage.
#
# Usage : docker compose -f docker-compose.dev.yml up --build

services:
  mysql:
    image: mysql:8.4
    container_name: samparis12-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: samparis12db
      MYSQL_USER: samparis12
      MYSQL_PASSWORD: samparis12
      MYSQL_ROOT_PASSWORD: samparis12root
    ports:
      - "3307:3306"
    volumes:
      - samparis12-dev-mysql-data:/var/lib/mysql
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psamparis12root"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samparis12-dev-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: samparis12db
      DB_USER: samparis12
      DB_PASSWORD: samparis12
      APP_PORT: 8080
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  samparis12-dev-mysql-data:
